  <text x="82" y="68" fill="#16392f" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-3.4">zansi</text>
  <text x="234" y="47" fill="#e8694a" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4.1">MEGA STORE</text>
